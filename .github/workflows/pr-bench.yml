name: PR Benchmarks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-benchmarks:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
      criterion_args: ${{ steps.matrix.outputs.criterion_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Discover benchmark targets
        id: matrix
        env:
          CRITERION_ARGS: "--noplot --sample-size 80 --measurement-time 6"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BENCHMARKS=$(python3 .github/scripts/benchmark_matrix.py "$BASE_SHA" "$HEAD_SHA" --criterion-args "$CRITERION_ARGS")
          printf 'benchmarks=%s\ncriterion_args=%s\n' "$BENCHMARKS" "$CRITERION_ARGS" >> "$GITHUB_OUTPUT"

  bench:
    needs: prepare-benchmarks
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@55dff7c6889e575e9b8c459bf5deb089c0a9bb52 # runner image selection
    with:
      runs_on: ubuntu-26.04
      action_ref: 55dff7c6889e575e9b8c459bf5deb089c0a9bb52
      backend: all
      benchmarks_json: ${{ needs.prepare-benchmarks.outputs.benchmarks }}
      auto_discover: false
      criterion_cli_args: ${{ needs.prepare-benchmarks.outputs.criterion_args }}
      criterion_statistic: median
      regression_threshold_pct_gungraun: 3
      regression_threshold_pct_criterion: 8
      fail_on_regression: true
