name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mreg
          POSTGRES_PASSWORD: mreg
          POSTGRES_DB: mreg
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mreg -d mreg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MREG_TEST_DATABASE_URL: postgres://mreg:mreg@localhost:5433/mreg_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Create test database
        env:
          PGPASSWORD: mreg
        run: psql -h localhost -p 5433 -U mreg -d mreg -c "CREATE DATABASE mreg_test"

      - name: Run full test suite
        run: cargo test --locked --all-features
        env:
          MREG_TEST_DATABASE_URL: postgres://mreg:mreg@localhost:5433/mreg_test

      - name: Lint with clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Treetop authorization integration
        run: scripts/test-treetop-authz.sh --all-features

      - name: Compile benchmark targets
        run: cargo bench --locked --no-run

      - name: Smoke-test benchmark fixtures
        run: >-
          cargo bench --locked
          --bench record_listing_criterion
          --bench attachment_graph_delete_criterion
          --bench host_delete_ptr_cascade_criterion
          --bench import_batch_run_criterion
          --bench import_attachment_ip_criterion
          -- --test
