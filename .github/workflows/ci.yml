name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mreg
          POSTGRES_PASSWORD: mreg
          POSTGRES_DB: mreg
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mreg -d mreg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MREG_TEST_DATABASE_URL: postgres://mreg:mreg@localhost:5433/mreg_test

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Create test database
        env:
          PGPASSWORD: mreg
        run: psql -h localhost -p 5433 -U mreg -d mreg -c "CREATE DATABASE mreg_test"

      - name: Run full test suite
        run: cargo test
        env:
          MREG_TEST_DATABASE_URL: postgres://mreg:mreg@localhost:5433/mreg_test

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile benchmark targets
        run: cargo bench --no-run

  mreg-cli:
    name: Test with mreg-cli
    runs-on: ubuntu-latest
    env:
      MREG_CLI_COMMIT: 72e598d3602812fc61a2d3a248ac8f4385dfb118
      MREG_CLI_ALLOWED_STATUSES: "501"

    steps:
      - name: Checkout mreg-rust
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Checkout pinned mreg-cli
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: unioslo/mreg-cli
          ref: ${{ env.MREG_CLI_COMMIT }}
          path: mreg-cli

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run the upstream CLI testsuite and compare results
        env:
          MREG_CLI_DIR: ${{ github.workspace }}/mreg-cli
        run: scripts/run-mreg-cli-compat.sh

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mreg-rust-compat.log
