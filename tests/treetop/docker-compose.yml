services:
  policy-host:
    image: svenstaro/miniserve:0.35.0
    ports:
      - "18080:8080"
    volumes:
      - .:/data:ro
    command: ["/data", "--port", "8080"]

  treetop-rest:
    image: ${TREETOP_IMAGE:-ghcr.io/treetop-policy-engine/treetop-rest@sha256:e29baeb5b498f21c72dccd9d08ab43198fa4705cecb40643d0ee97b63cc1c932}
    platform: linux/amd64
    depends_on:
      - policy-host
    ports:
      - "9999:9999"
    environment:
      TREETOP_LISTEN: 0.0.0.0
      TREETOP_PORT: 9999
      TREETOP_POLICY_URL: http://policy-host:8080/mreg.cedar
      TREETOP_LABELS_URL: http://policy-host:8080/labels.json
      TREETOP_CLIENT_ALLOWLIST: "*"
