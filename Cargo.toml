[package]
name = "mreg-rust"
version = "0.1.0"
edition = "2024"

[features]
default = ["rustls"]
rustls = ["actix-web/rustls-0_23", "dep:rustls"]
openssl = ["actix-web/openssl", "dep:openssl"]
amqp = ["dep:lapin"]
redis = ["dep:redis"]
ldap = ["dep:ldap3"]
# Exposes a handful of internal helpers (response builders, template rendering)
# as `pub` for the benchmarks under `benches/`. Off by default so production
# library builds keep these crate-internal.
bench-helpers = []

[dependencies]
# The server uses HTTP/1 via HttpServer::bind; omit the unused HTTP/2
# feature, which still pulls the vulnerable h2 0.3 release line.
actix-web = { version = "4.17.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
rustls = { version = "0.23", optional = true }
openssl = { version = "0.10", optional = true }
async-trait = "0.1.92"
argon2 = "0.6.0"
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.14", features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
diesel_migrations = "2.3.2"
email_address = "0.2.9"
futures = "0.3"
ipnet = { version = "2.12.2", features = ["serde"] }
macaddr = "1.0.1"
minijinja = { version = "3.0.1", features = ["json", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
url = "2"
actix-governor = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync"] }
treetop-client = { git = "https://github.com/treetop-policy-engine/treetop-client", rev = "78df97aabeabadfa5a92ea0501dff8752a2a5a4f" }
tracing = "0.1.44"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
hickory-proto = "0.26"
utoipa = { version = "6", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
# The pinned Utoipa security fix requires uuid <1.27.
uuid = { version = ">=1.26.1, <1.27", features = ["serde", "v4"] }
lapin = { version = "4", optional = true }
redis = { version = "1.7", features = ["tokio-comp", "streams"], optional = true }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
ldap3 = { version = "0.12.1", optional = true, default-features = false, features = ["tls-rustls-ring"] }
rand = "0.10"
regex = "1"
toml = "1.1"

[dev-dependencies]
actix-http = "3"
rstest = "0.27"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.20.0"
serde_urlencoded = "0.7"
# Self-dep activates `bench-helpers` for tests/benches/examples while keeping
# it off for the library's production build (`cargo build`/`cargo run`).
mreg-rust = { path = ".", features = ["bench-helpers"] }

